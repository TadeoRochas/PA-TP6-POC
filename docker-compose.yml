services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: poc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: poc-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  mongo:
    image: mongo:7
    container_name: poc-mongo
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mongo-data:/data/db

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "mongodb://mongo:27017/admin", "--eval", "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } catch (e) { print(e) }"]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: poc-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  activation-api:
    build:
      context: .
      dockerfile: apps/activation-api/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: activation-api
      KAFKA_GROUP_ID: activation-api-svc
      MONGO_URI: mongodb://mongo:27017/activation_db?replicaSet=rs0&directConnection=true
      MAILHOG_HOST: mailhog

  billing-service:
    build:
      context: .
      dockerfile: apps/billing-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: billing-service
      KAFKA_GROUP_ID: billing-svc
      MONGO_URI: mongodb://mongo:27017/billing_db?replicaSet=rs0&directConnection=true

  provisioning-service:
    build:
      context: .
      dockerfile: apps/provisioning-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: provisioning-service
      KAFKA_GROUP_ID: provisioning-svc
      MONGO_URI: mongodb://mongo:27017/provisioning_db?replicaSet=rs0&directConnection=true

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-svc
      MONGO_URI: mongodb://mongo:27017/notification_db?replicaSet=rs0&directConnection=true
      SMTP_HOST: mailhog
      SMTP_PORT: 1025

  crm-analytics-service:
    build:
      context: .
      dockerfile: apps/crm-analytics-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: crm-analytics-service
      KAFKA_GROUP_ID: crm-analytics
      MONGO_URI: mongodb://mongo:27017/crm_db?replicaSet=rs0&directConnection=true

  loyalty-service:
    profiles: ["loyalty"]
    build:
      context: .
      dockerfile: apps/loyalty-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: loyalty-service
      KAFKA_GROUP_ID: loyalty-svc
      MONGO_URI: mongodb://mongo:27017/loyalty_db?replicaSet=rs0&directConnection=true

  demo-ui:
    build:
      context: .
      dockerfile: apps/demo-ui/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - activation-api
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: http://localhost:3000

volumes:
  mongo-data:

